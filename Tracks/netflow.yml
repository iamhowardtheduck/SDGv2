      - name: rip4
        type: int
        range: 0,255

      - name: ingressinterface
        type: int
        range: 0,15

      - name: egressinterface
        type: int
        range: 0,7

      - name: destinationbytes
        type: int
        range: 0,16684

      - name: destinationpackets
        type: int
        range: 1,128

      - name: destinationport
        type: int
        range: 1024,65536

      - name: destinationip
        type: random_string_from_list
        custom_list: 68.173.32.10      
      
      - name: 2rip1
        type: int
        range: 10,10

      - name: 2rip2
