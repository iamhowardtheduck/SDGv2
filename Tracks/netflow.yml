elasticsearchScheme: http
elasticsearchHost: localhost
elasticsearchPort: 30920
elasticsearchUser: sdg
elasticsearchPassword: changeme
workloads:
  - workloadName: netflow-outbound
    workloadThreads: 4
    workloadSleep: 10
    indexName: logs-netflow.log-default
    fields:
      - name: destinationbytes
        type: int
        range: 0,16684045

      - name: destinationpackets
        type: int
        range: 0,1024

      - name: destinationport
        type: random_string_from_list
        custom_list: 2443,1443,3443,4443,5443,10153,10253,10353,10453,10553,6443,7443,8443

      - name: ripcodes
        type: random_string_from_list
        custom_list: 94,95,173

      - name: rip2
        type: random_string_from_list
        custom_list: 45,181

      - name: rip3
        type: int
        range: 179,181

      - name: rip4
        type: int
        range: 28,28

      - name: ingressinterface
        type: int
        range: 0,15

      - name: egressinterface
        type: int
        range: 0,7

      - name: sourcebytes
        type: int
        range: 0,16684

      - name: sourcepackets
        type: int
        range: 1,128


      - name: sourceport
        type: int
        range: 3389,3389,3389,3389,22,22,22,23,23,23,23,23,3389

      - name: sourceip
        type: random_string_from_list
        custom_list: 68.173.32.10,72.95.137.39

      - name: 2rip1
        type: int
        range: 10,10

      - name: 2rip2
        type: int
        range: 49,49

      - name: 2rip3
        type: int
        range: 110,110

      - name: 2rip4
        type: int
        range: 17,17

      - name: networkdirection
        type: random_string_from_list
        custom_list: external        
