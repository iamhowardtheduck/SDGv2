elasticsearchScheme: http
elasticsearchHost: localhost
elasticsearchPort: 30920
elasticsearchUser: sdg
elasticsearchPassword: changeme
workloads:
  - workloadName: netflow-outbound
    workloadThreads: 10
    workloadSleep: 10
    indexName: logs-netflow.log-default
    fields:
      - name: destinationbytes
        type: int
        range: 0,16684045

      - name: destinationpackets
        type: int
        range: 0,1024

      - name: destinationport
        type: random_string_from_list
        custom_list: 80,443,8080,443,443,443,443,80,80,53,53,53,53,53,443,443,443,25,25,25      

      - name: ripcodes
        type: int
        range: 1,251

      - name: rip2
        type: int
        range: 0,255

      - name: rip3
        type: int
        range: 0,255

      - name: rip4
        type: int
        range: 0,255

      - name: ingressinterface
        type: int
        range: 0,15

      - name: egressinterface
        type: int
        range: 0,7

      - name: sourcebytes
        type: int
        range: 0,16684

      - name: sourcepackets
        type: int
        range: 1,128

      - name: sourceport
        type: int
        range: 1024,65536

      - name: sourceip
        type: random_string_from_list
        custom_list: 68.173.32.10      
      
      - name: 2rip1
        type: int
        range: 10,10

      - name: 2rip2
        type: int
        range: 30,50

      - name: 2rip3
        type: int
        range: 100,200

      - name: 2rip4
        type: int
        range: 0,254

      - name: networkdirection
        type: random_string_from_list
        custom_list: external


  - workloadName: netflow-outbound-malware
