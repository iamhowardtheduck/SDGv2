elasticsearchScheme: http
elasticsearchHost: localhost
elasticsearchPort: 30920
elasticsearchUser: sdg
elasticsearchPassword: changeme
workloads:
  - workloadName: financial-smurfing-good
    workloadThreads: 14
    workloadSleep: 1
    indexName: financial-smurfing
    fields:
      - name: cents
        type: int
        range: 0,99

      - name: dollars
        type: int
        range: 100,9000

      - name: type
        type: random_string_from_list
        custom_list: eft,card,mobile,online,international,cash

      - name: direction
        type: random_string_from_list
        custom_list: inbound,outbound

      - name: number
        type: int
        range: 1,34995

      - name: year
        type: int
        range: 2025,2025

      - name: month
        type: int
        range: 10,10

      - name: day
        type: int
        range: 1,31

      - name: ripcodes
        type: int
        range: 1,220

      - name: rip2
        type: int
        range: 0,255

      - name: rip3
        type: int
        range: 0,255

      - name: rip4
        type: int
        range: 0,255

  - workloadName: financial-smurfing-bad
    workloadThreads: 1
    workloadSleep: 10
    indexName: financial-smurfing
    fields:
      - name: cents
        type: int
        range: 0,99

      - name: dollars
        type: int
        range: 9000,9999

      - name: type
        type: random_string_from_list
        custom_list: eft,card,mobile,online,international,cash

      - name: number
        type: int
        range: 34996,35000

      - name: year
        type: int
        range: 2025,2025

      - name: month
        type: int
        range: 10,10

      - name: day
        type: int
        range: 1,31

      - name: ripcodes
        type: int
        range: 1,220
      - name: rip2
        type: int
        range: 0,255

      - name: rip3
        type: int
        range: 0,255

      - name: rip4
        type: int
        range: 0,255
